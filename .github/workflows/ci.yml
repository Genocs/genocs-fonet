name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Genocs.Fonet.sln

      - name: Build
        run: dotnet build Genocs.Fonet.sln -c Release --no-restore

      - name: Test
        run: dotnet test src/tests/Genocs.Fonet.Tests/Genocs.Fonet.Tests.csproj -c Release --no-build --verbosity normal
